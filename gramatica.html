<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gramática e Prontuário — Missão Escolar</title>
<link rel="stylesheet" href="style.css?v=20261018-1220">
<style>
  /* Gramática · Prontuário · Verbos: one part at a time, calm and printable */
  .g-head h1{ margin:6px 0 4px; font-size:clamp(1.5rem,1.2rem+1.4vw,2rem); }
  .g-head p{ margin:0 0 14px; color:var(--text-muted); }
  .g-busca{ width:100%; box-sizing:border-box; font:inherit; padding:11px 14px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); margin:0 0 14px; }
  .g-busca:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .gr-item{ background:var(--surface); border:1px solid var(--border-soft); border-radius:14px; margin:0 0 8px; box-shadow:var(--shadow); }
  .gr-item summary{ cursor:pointer; padding:13px 16px; font-family:"Lexend",sans-serif; font-weight:800; }
  .gr-body{ padding:0 16px 14px; line-height:1.6; }
  .gr-regra{ margin:0 0 10px; }
  .gr-h{ font-weight:800; margin:10px 0 4px; }
  .gr-body ul{ margin:0; padding-left:20px; }
  .gr-truque{ margin:12px 0 6px; padding:10px 12px; border-radius:12px; background:var(--surface-2); }
  .gr-erro{ margin:6px 0 0; color:var(--text-muted); }
  .pr-cat{ margin:0 0 18px; }
  .pr-cat h2{ font-size:1.05rem; margin:0 0 8px; }
  .pr-item{ background:var(--surface); border:1px solid var(--border-soft); border-left:5px solid var(--accent); border-radius:12px; padding:10px 14px; margin:0 0 8px; }
  .pr-item p{ margin:3px 0; line-height:1.55; }
  .pr-e{ font-weight:700; }
  .pr-r{ color:var(--text-muted); font-size:.93rem; }
  .pr-tab, .v-table{ border-collapse:collapse; width:100%; max-width:520px; background:var(--surface); }
  .pr-tab th, .pr-tab td, .v-table th, .v-table td{ border:1px solid var(--border); padding:8px 12px; text-align:left; }
  .pr-tab thead th{ background:var(--surface-2); font-family:"Lexend",sans-serif; }
  .v-sel{ display:flex; gap:10px; flex-wrap:wrap; margin:0 0 14px; }
  .v-sel label{ display:flex; flex-direction:column; gap:4px; font-weight:700; font-size:.9rem; }
  .v-sel select{ font:inherit; padding:9px 12px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); min-width:200px; }
  .v-table caption{ text-align:left; font-family:"Lexend",sans-serif; font-weight:800; padding:0 0 8px; }
  .v-table th{ width:45%; font-weight:400; color:var(--text-muted); }
  .v-nao{ color:var(--text-muted); font-style:italic; }
  .v-nota{ color:var(--text-muted); font-size:.9rem; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .g-vazio{ background:var(--surface); border:1px dashed var(--border); border-radius:14px; padding:16px; text-align:center; color:var(--text-muted); }
  @media print{
    .topbar, .subtabs, .g-busca{ display:none !important; }
    [hidden]{ display:block !important; }
    .gr-item{ box-shadow:none; break-inside:avoid; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <p class="crumbs"><a href="index.html">🏠 Início</a> › Gramática e Prontuário</p>
    <a class="ghost" href="6ano.html#pt">📖 Português</a>
  </div>

  <header class="g-head">
    <h1>📘 Gramática e Prontuário</h1>
    <p>Consulta rápida de português de Portugal (Acordo Ortográfico de 1990), para quando tens uma dúvida a estudar ou a escrever.</p>
  </header>

  <div class="subtabs" role="tablist" aria-label="Partes">
    <button type="button" class="subtab" role="tab" data-parte="gram">📘 Gramática</button>
    <button type="button" class="subtab" role="tab" data-parte="pront">📗 Prontuário</button>
    <button type="button" class="subtab" role="tab" data-parte="verbos">🔤 Verbos</button>
  </div>

  <div id="g-busca-wrap">
    <label class="sr-only" for="g-busca">Procurar</label>
    <input class="g-busca" id="g-busca" type="search" placeholder="🔍 Procura uma dúvida: há, porquê, mesóclise, vírgula…" autocomplete="off">
  </div>
  <p class="g-vazio" id="g-vazio" hidden>Não encontrei nada com essa palavra. Experimenta outra, sem acentos ou mais curta.</p>

  <div id="g-gram" role="tabpanel"></div>
  <div id="g-pront" role="tabpanel" hidden></div>
  <div id="g-verbos" role="tabpanel" hidden>
    <div class="v-sel">
      <label>Verbo <select id="v-verbo"></select></label>
      <label>Tempo <select id="v-tempo"></select></label>
    </div>
    <div id="v-tab" aria-live="polite"></div>
  </div>
</div>

<script src="data/gramatica-pt.js?v=20261018-1220"></script>
<script src="gramatica.js?v=20261018-1220"></script>
</body>
</html>
