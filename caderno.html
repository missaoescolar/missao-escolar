<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O meu caderno — Missão Escolar</title>
<link rel="stylesheet" href="style.css?v=20261014-0917">
<style>
  /* the caderno: every exit ticket, grouped by subject; prints cleanly */
  .cad-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; margin:6px 0 16px; }
  .cad-head h1{ margin:0; font-size:clamp(1.5rem,1.2rem+1.4vw,2rem); }
  .cad-head p{ margin:4px 0 0; color:var(--text-muted); }
  .cad-disc{ margin:0 0 20px; }
  .cad-disc h2{ font-size:1.05rem; margin:0 0 8px; }
  .cad-entry{ background:var(--surface); border:1px solid var(--border-soft); border-left:5px solid var(--wc, var(--accent)); border-radius:14px; padding:12px 14px; margin:0 0 10px; box-shadow:var(--shadow); }
  .cad-entry h3{ margin:0 0 6px; font-size:0.98rem; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .cad-entry h3 small{ font-family:"Lexend",sans-serif; font-weight:700; color:var(--text-muted); }
  .cad-entry dl{ margin:0; display:grid; grid-template-columns:minmax(150px,210px) 1fr; gap:4px 12px; font-size:0.92rem; }
  .cad-entry dt{ font-weight:700; }
  .cad-entry dd{ margin:0; white-space:pre-wrap; }
  .cad-entry dd.vazio{ color:var(--text-muted); font-style:italic; }
  .cad-entry a{ display:inline-block; margin-top:8px; color:var(--accent); font-family:"Lexend",sans-serif; font-weight:700; font-size:0.86rem; }
  .cad-vazio{ background:var(--surface); border:1px dashed var(--border); border-radius:14px; padding:18px; text-align:center; color:var(--text-muted); }
  @media (max-width:560px){ .cad-entry dl{ grid-template-columns:1fr; } }
  @media print{
    .topbar, .cad-print, .cad-entry a{ display:none !important; }
    .cad-entry{ box-shadow:none; break-inside:avoid; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <p class="crumbs"><a href="index.html">🏠 Início</a> › O meu caderno</p>
    <a class="ghost" href="pais.html">👪 Para pais</a>
  </div>

  <div class="cad-head">
    <div>
      <h1>📓 O meu caderno</h1>
      <p>Os teus bilhetes de saída: o que aprendeste, o que ainda não percebeste e o que queres saber.</p>
    </div>
    <button type="button" class="ghost cad-print" onclick="window.print()">🖨️ Imprimir</button>
  </div>

  <div id="caderno"></div>
</div>
