<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background-color: #FBF7F0; font-family: 'Atkinson Hyperlegible', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Filtros de sombra suave no estilo Caderno Vivo -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3B372F" flood-opacity="0.07"/>
    </filter>
    <filter id="card-shadow" x="-4%" y="-5%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3B372F" flood-opacity="0.06"/>
    </filter>
    <filter id="block-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B372F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 0. FUNDO GERAL DE PAPEL DE CADERNO -->
  <rect width="800" height="450" fill="#FBF7F0"/>

  <!-- ======================================================== -->
  <!-- CABEÇALHO PEDAGÓGICO CURRICULAR (MATEMÁTICA / ECONOMIA)  -->
  <!-- ======================================================== -->
  <g id="cabecalho-curricular" text-anchor="middle">
    <rect x="180" y="12" width="440" height="30" rx="15" fill="#FFFFFF" stroke="#E8E0D5" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <text x="406" y="32" fill="#C7461F" font-size="11.5" font-weight="700" letter-spacing="0.4">
      SISTEMA MONETÁRIO · AS 8 MOEDAS DE EURO EM BLOCOS
    </text>
  </g>

  <!-- ====================================================================== -->
  <!-- PAINEL CENTRAL DE APRESENTAÇÃO DAS 8 MOEDAS LADO A LADO                -->
  <!-- ====================================================================== -->
  <g id="painel-moedas-euro" filter="url(#card-shadow)">
    <!-- Cartão base que acolhe todas as moedas alinhadas na mesma linha de chão -->
    <rect x="20" y="54" width="760" height="270" rx="12" fill="#FFFFFF" stroke="#3B372F" stroke-width="1.8"/>

    <!-- Título do painel -->
    <g id="titulo-ordem-crescente">
      <rect x="34" y="66" width="310" height="22" rx="11" fill="#FFF8F5" stroke="#C7461F" stroke-width="1.2"/>
      <circle cx="46" cy="77" r="3.5" fill="#C7461F"/>
      <text x="56" y="81" fill="#3B372F" font-size="10.5" font-weight="700">
        Ordem crescente de valor facial · 8 moedas
      </text>
    </g>

    <!-- Legenda orientadora da linha de chão das moedas -->
    <g id="legenda-chao">
      <text x="760" y="81" text-anchor="end" fill="#7A7369" font-size="9.5" font-weight="600">
        Tamanhos relativos didáticos (diâmetro real em mm)
      </text>
    </g>

    <!-- Linha de base horizontal de apoio das moedas (y = 232) -->
    <g id="linha-apoio-chao" stroke="#E8E0D5" stroke-width="2">
      <line x1="34" y1="234" x2="766" y2="234"/>
      <!-- Seta indicativa discreta de progressão -->
      <line x1="34" y1="234" x2="756" y2="234" stroke="#C7461F" stroke-width="1.5" stroke-dasharray="4,4"/>
      <polygon points="754,231 760,234 754,237" fill="#C7461F"/>
    </g>

    <!-- ================================================================== -->
    <!-- GRUPO 1: MOEDAS DE COBRE (AÇO COBERTO A COBRE) - 1, 2, 5 cêntimos   -->
    <!-- Diâmetros reais: 1c = 16.25mm | 2c = 18.75mm | 5c = 21.25mm        -->
    <!-- Raio no SVG: 1c -> r=18 | 2c -> r=22 | 5c -> r=26                  -->
    <!-- ================================================================== -->

    <!-- Moldura de agrupamento sutil: Família Cobre -->
    <rect x="30" y="96" width="224" height="216" rx="8" fill="#FFF5F2" stroke="#F0D4CB" stroke-width="1.2"/>
    <g text-anchor="middle">
      <rect x="74" y="102" width="136" height="18" rx="9" fill="#FFFFFF" stroke="#C7461F" stroke-width="1"/>
      <circle cx="86" cy="111" r="3" fill="#C7461F"/>
      <text x="146" y="114.5" fill="#C7461F" font-size="9" font-weight="700">Liga de cobre</text>
    </g>

    <!-- 1. MOEDA: 1 CÊNTIMO (cx = 64, cy = 232 - r = 214, r = 18) -->
    <g id="moeda-1-cent" filter="url(#block-shadow)">
      <!-- Espessura da borda / relevo de bloco da moeda -->
      <circle cx="64" cy="216" r="18" fill="#9C3312" stroke="#3B372F" stroke-width="1.6"/>
      <!-- Face frontal em tom terracota de cobre (#C7461F e reflexo #E28D73) -->
      <circle cx="64" cy="214" r="18" fill="#C7461F" stroke="#3B372F" stroke-width="1.6"/>
      <!-- Anel interior concêntrico em relevo geométrico de moeda -->
      <circle cx="64" cy="214" r="14" fill="#B93D18" stroke="none"/>
      <!-- Ranhura interior sutil -->
      <circle cx="64" cy="214" r="13" fill="#C7461F" stroke="none"/>
      <!-- Número 1 nítido e simples no centro (sem desenhos nacionais) -->
      <text x="64" y="220" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">1</text>
      <!-- Etiqueta de valor -->
      <g text-anchor="middle">
        <rect x="42" y="244" width="44" height="22" rx="4" fill="#FFFFFF" stroke="#C7461F" stroke-width="1.4"/>
        <text x="64" y="255" fill="#3B372F" font-size="9.5" font-weight="700">1 c</text>
        <text x="64" y="263" fill="#7A7369" font-size="7.5">16,25 mm</text>
        <text x="64" y="278" fill="#665E55" font-size="8.5" font-weight="600">0,01 €</text>
      </g>
    </g>

    <!-- 2. MOEDA: 2 CÊNTIMOS (cx = 138, cy = 232 - r = 210, r = 22) -->
    <g id="moeda-2-cent" filter="url(#block-shadow)">
      <circle cx="138" cy="212" r="22" fill="#9C3312" stroke="#3B372F" stroke-width="1.6"/>
      <circle cx="138" cy="210" r="22" fill="#C7461F" stroke="#3B372F" stroke-width="1.6"/>
      <!-- Bordo exterior com ranhura (relevo da moeda de 2 cêntimos) -->
      <circle cx="138" cy="210" r="18" fill="#B93D18" stroke="none"/>
      <circle cx="138" cy="210" r="17" fill="#C7461F" stroke="none"/>
      <!-- Número 2 -->
      <text x="138" y="217" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">2</text>
      <g text-anchor="middle">
        <rect x="116" y="244" width="44" height="22" rx="4" fill="#FFFFFF" stroke="#C7461F" stroke-width="1.4"/>
        <text x="138" y="255" fill="#3B372F" font-size="9.5" font-weight="700">2 c</text>
        <text x="138" y="263" fill="#7A7369" font-size="7.5">18,75 mm</text>
        <text x="138" y="278" fill="#665E55" font-size="8.5" font-weight="600">0,02 €</text>
      </g>
    </g>

    <!-- 3. MOEDA: 5 CÊNTIMOS (cx = 218, cy = 232 - r = 206, r = 26) -->
    <g id="moeda-5-cent" filter="url(#block-shadow)">
      <circle cx="218" cy="208" r="26" fill="#9C3312" stroke="#3B372F" stroke-width="1.6"/>
      <circle cx="218" cy="206" r="26" fill="#C7461F" stroke="#3B372F" stroke-width="1.6"/>
      <circle cx="218" cy="206" r="21" fill="#B93D18" stroke="none"/>
      <circle cx="218" cy="206" r="20" fill="#C7461F" stroke="none"/>
      <!-- Número 5 -->
      <text x="218" y="214" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">5</text>
      <g text-anchor="middle">
        <rect x="196" y="244" width="44" height="22" rx="4" fill="#FFFFFF" stroke="#C7461F" stroke-width="1.4"/>
        <text x="218" y="255" fill="#3B372F" font-size="9.5" font-weight="700">5 c</text>
        <text x="218" y="263" fill="#7A7369" font-size="7.5">21,25 mm</text>
        <text x="218" y="278" fill="#665E55" font-size="8.5" font-weight="600">0,05 €</text>
      </g>
    </g>

    <!-- ================================================================== -->
    <!-- GRUPO 2: MOEDAS DOURADAS (OURO NÓRDICO) - 10, 20, 50 cêntimos       -->
    <!-- Diâmetros reais: 10c = 19.75mm | 20c = 22.25mm | 50c = 24.25mm     -->
    <!-- Raio no SVG: 10c -> r=23 | 20c -> r=27 | 50c -> r=31               -->
    <!-- Nota: A de 10c é menor que a de 5c real e pedagogicamente visível  -->
    <!-- ================================================================== -->

    <!-- Moldura de agrupamento: Família Ouro Nórdico -->
    <rect x="264" y="96" width="270" height="216" rx="8" fill="#FFFBF0" stroke="#F0E3C7" stroke-width="1.2"/>
    <g text-anchor="middle">
      <rect x="325" y="102" width="148" height="18" rx="9" fill="#FFFFFF" stroke="#E0A100" stroke-width="1"/>
      <circle cx="337" cy="111" r="3" fill="#E0A100"/>
      <text x="403" y="114.5" fill="#C68E00" font-size="9" font-weight="700">Liga dourada (ouro nórdico)</text>
    </g>

    <!-- 4. MOEDA: 10 CÊNTIMOS (cx = 308, cy = 232 - r = 209, r = 23) -->
    <!-- Menor que a de 5c (23px vs 26px), detalhe fiel ao sistema do euro -->
    <g id="moeda-10-cent" filter="url(#block-shadow)">
      <circle cx="308" cy="211" r="23" fill="#B38000" stroke="#3B372F" stroke-width="1.6"/>
      <circle cx="308" cy="209" r="23" fill="#E0A100" stroke="#3B372F" stroke-width="1.6"/>
      <!-- Bordo recortado/serrilhado didático com pontos circulares -->
      <circle cx="308" cy="209" r="19" fill="#FCE49C" stroke="none"/>
      <circle cx="308" cy="209" r="18" fill="#E0A100" stroke="none"/>
      <!-- Número 10 -->
      <text x="308" y="216" text-anchor="middle" fill="#3B372F" font-size="18" font-weight="700">10</text>
      <g text-anchor="middle">
        <rect x="286" y="244" width="44" height="22" rx="4" fill="#FFFFFF" stroke="#E0A100" stroke-width="1.4"/>
        <text x="308" y="255" fill="#3B372F" font-size="9.5" font-weight="700">10 c</text>
        <text x="308" y="263" fill="#7A7369" font-size="7.5">19,75 mm</text>
        <text x="308" y="278" fill="#665E55" font-size="8.5" font-weight="600">0,10 €</text>
      </g>
    </g>

    <!-- 5. MOEDA: 20 CÊNTIMOS (cx = 398, cy = 232 - r = 205, r = 27) -->
    <!-- Bordo com a famosa «flor espanhola» (7 reentrâncias estilizadas em blocos) -->
    <g id="moeda-20-cent" filter="url(#block-shadow)">
      <circle cx="398" cy="207" r="27" fill="#B38000" stroke="#3B372F" stroke-width="1.6"/>
      <circle cx="398" cy="205" r="27" fill="#E0A100" stroke="#3B372F" stroke-width="1.6"/>
      <!-- Anel interior -->
      <circle cx="398" cy="205" r="22.5" fill="#FCE49C" stroke="none"/>
      <circle cx="398" cy="205" r="21.5" fill="#E0A100" stroke="none"/>
      <!-- Entalhes didáticos da flor espanhola nos 4 pontos cardeais em bloco -->
      <circle cx="398" cy="180" r="1.8" fill="#FFFFFF"/>
      <circle cx="423" cy="205" r="1.8" fill="#FFFFFF"/>
      <circle cx="398" cy="230" r="1.8" fill="#FFFFFF"/>
      <circle cx="373" cy="205" r="1.8" fill="#FFFFFF"/>
      <!-- Número 20 -->
      <text x="398" y="213" text-anchor="middle" fill="#3B372F" font-size="20" font-weight="700">20</text>
      <g text-anchor="middle">
        <rect x="376" y="244" width="44" height="22" rx="4" fill="#FFFFFF" stroke="#E0A100" stroke-width="1.4"/>
        <text x="398" y="255" fill="#3B372F" font-size="9.5" font-weight="700">20 c</text>
        <text x="398" y="263" fill="#7A7369" font-size="7.5">22,25 mm</text>
        <text x="398" y="278" fill="#665E55" font-size="8.5" font-weight="600">0,20 €</text>
      </g>
    </g>

    <!-- 6. MOEDA: 50 CÊNTIMOS (cx = 492, cy = 232 - r = 201, r = 31) -->
    <g id="moeda-50-cent" filter="url(#block-shadow)">
      <circle cx="492" cy="203" r="31" fill="#B38000" stroke="#3B372F" stroke-width="1.6"/>
      <circle cx="492" cy="201" r="31" fill="#E0A100" stroke="#3B372F" stroke-width="1.6"/>
      <circle cx="492" cy="201" r="26" fill="#FCE49C" stroke="none"/>
      <circle cx="492" cy="201" r="25" fill="#E0A100" stroke="none"/>
      <!-- Número 50 -->
      <text x="492" y="210" text-anchor="middle" fill="#3B372F" font-size="23" font-weight="700">50</text>
      <g text-anchor="middle">
        <rect x="470" y="244" width="44" height="22" rx="4" fill="#FFFFFF" stroke="#E0A100" stroke-width="1.4"/>
        <text x="492" y="255" fill="#3B372F" font-size="9.5" font-weight="700">50 c</text>
        <text x="492" y="263" fill="#7A7369" font-size="7.5">24,25 mm</text>
        <text x="492" y="278" fill="#665E55" font-size="8.5" font-weight="600">0,50 €</text>
      </g>
    </g>

    <!-- ================================================================== -->
    <!-- GRUPO 3: MOEDAS BIMETÁLICAS - 1 € e 2 €                             -->
    <!-- 1 € : Anel Dourado (latão) + Centro Prateado (cupraníquel)          -->
    <!--       Diâmetro: 23.25mm -> Raio no SVG: r=29 (menor que a de 50c!)  -->
    <!-- 2 € : Anel Prateado (cupraníquel) + Centro Dourado (latão)          -->
    <!--       Diâmetro: 25.75mm -> Raio no SVG: r=34 (a maior de todas!)     -->
    <!-- ================================================================== -->

    <!-- Moldura de agrupamento: Família Bimetálica -->
    <rect x="544" y="96" width="224" height="216" rx="8" fill="#F0F4F8" stroke="#D3E2EE" stroke-width="1.2"/>
    <g text-anchor="middle">
      <rect x="588" y="102" width="136" height="18" rx="9" fill="#FFFFFF" stroke="#4F86B3" stroke-width="1"/>
      <circle cx="600" cy="111" r="3" fill="#4F86B3"/>
      <text x="658" y="114.5" fill="#3E729E" font-size="9" font-weight="700">Moedas bimetálicas</text>
    </g>

    <!-- 7. MOEDA: 1 EURO (cx = 604, cy = 232 - r = 203, r = 29) -->
    <!-- Exterior: Dourado (latão) | Centro: Prateado (cupraníquel) -->
    <g id="moeda-1-euro" filter="url(#block-shadow)">
      <!-- Espessura da moeda -->
      <circle cx="604" cy="205" r="29" fill="#B38000" stroke="#3B372F" stroke-width="1.6"/>
      <!-- Anel exterior dourado (#E0A100) -->
      <circle cx="604" cy="203" r="29" fill="#E0A100" stroke="#3B372F" stroke-width="1.6"/>
      <!-- Disco central prateado (#EAE5DE e sombra #BDB6AD) -->
      <circle cx="604" cy="203" r="19" fill="#BDB6AD" stroke="#3B372F" stroke-width="1.4"/>
      <circle cx="604" cy="203" r="18" fill="#EAE5DE" stroke="none"/>
      <!-- Número e símbolo: 1 € -->
      <text x="604" y="211" text-anchor="middle" fill="#3B372F" font-size="21" font-weight="700">1 €</text>
      <g text-anchor="middle">
        <rect x="580" y="244" width="48" height="22" rx="4" fill="#FFFFFF" stroke="#4F86B3" stroke-width="1.4"/>
        <text x="604" y="255" fill="#3B372F" font-size="9.5" font-weight="700">1 €</text>
        <text x="604" y="263" fill="#7A7369" font-size="7.5">23,25 mm</text>
        <text x="604" y="278" fill="#3E8F5C" font-size="8.5" font-weight="700">1,00 €</text>
      </g>
    </g>

    <!-- 8. MOEDA: 2 EUROS (cx = 702, cy = 232 - r = 198, r = 34) -->
    <!-- Exterior: Prateado (cupraníquel) | Centro: Dourado (latão) - A maior de todas -->
    <g id="moeda-2-euro" filter="url(#block-shadow)">
      <!-- Espessura da moeda -->
      <circle cx="702" cy="200" r="34" fill="#8E8880" stroke="#3B372F" stroke-width="1.8"/>
      <!-- Anel exterior prateado (#EAE5DE / #D9CFC4) -->
      <circle cx="702" cy="198" r="34" fill="#EAE5DE" stroke="#3B372F" stroke-width="1.8"/>
      <!-- Disco central dourado (#E0A100 e relevo #FCE49C) -->
      <circle cx="702" cy="198" r="23" fill="#C68E00" stroke="#3B372F" stroke-width="1.4"/>
      <circle cx="702" cy="198" r="22" fill="#E0A100" stroke="none"/>
      <!-- Bordo interno sutil -->
      <circle cx="702" cy="198" r="19" fill="#FCE49C" opacity="0.35" stroke="none"/>
      <!-- Número e símbolo: 2 € -->
      <text x="702" y="207" text-anchor="middle" fill="#3B372F" font-size="25" font-weight="700">2 €</text>
      <g text-anchor="middle">
        <rect x="678" y="244" width="48" height="22" rx="4" fill="#FFFFFF" stroke="#4F86B3" stroke-width="1.4"/>
        <text x="702" y="255" fill="#3B372F" font-size="9.5" font-weight="700">2 €</text>
        <text x="702" y="263" fill="#7A7369" font-size="7.5">25,75 mm</text>
        <text x="702" y="278" fill="#3E8F5C" font-size="8.5" font-weight="700">2,00 €</text>
      </g>
    </g>

    <!-- Legenda inferior dentro do cartão principal: equivalência de 1 euro = 100 cêntimos -->
    <g id="bloco-equivalencia-100" transform="translate(34, 292)">
      <rect x="0" y="0" width="712" height="22" rx="6" fill="#F4ECE1" stroke="#E8E0D5" stroke-width="1"/>
      <text x="356" y="15" text-anchor="middle" fill="#3B372F" font-size="10" font-weight="600">
        Regra fundamental: <tspan fill="#C7461F" font-weight="700">1 euro = 100 cêntimos</tspan> (1 € = 100 c) · A moeda de 10 c é menor do que a de 5 c, e a moeda de 1 € é menor do que a de 50 c.
      </text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- BARRA INFERIOR / QUADRO PEDAGÓGICO DE SÍNTESE DAS 3 FAMÍLIAS (AO90)     -->
  <!-- ====================================================================== -->
  <g id="rodape-sintese" text-anchor="middle">
    <!-- Moldura de síntese -->
    <rect x="20" y="336" width="760" height="98" rx="10" fill="#FFFFFF" stroke="#3B372F" stroke-width="1.8" filter="url(#card-shadow)"/>

    <!-- 3 Cartões de Famílias de Moedas com propriedades físicas e materiais -->

    <!-- Cartão 1: Moedas de Cobre (1, 2, 5 cêntimos) -->
    <g transform="translate(32, 346)">
      <rect x="0" y="0" width="232" height="78" rx="8" fill="#FFF5F2" stroke="#F0D4CB" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="6" fill="#C7461F"/>
      <text x="16" y="21.5" fill="#FFF" font-size="9" font-weight="700">1</text>
      <text x="30" y="21" text-anchor="start" fill="#C7461F" font-size="10.5" font-weight="700">Família Cobre (1, 2 e 5 c)</text>
      <text x="12" y="38" text-anchor="start" fill="#3B372F" font-size="9">• Aço coberto com cobre avermelhado</text>
      <text x="12" y="52" text-anchor="start" fill="#3B372F" font-size="9">• Bordo liso (1c e 5c) e com ranhura (2c)</text>
      <text x="12" y="66" text-anchor="start" fill="#665E55" font-size="8.5">• Crescem em tamanho: 16 → 19 → 21 mm</text>
    </g>

    <!-- Cartão 2: Moedas Douradas (10, 20, 50 cêntimos) -->
    <g transform="translate(284, 346)">
      <rect x="0" y="0" width="232" height="78" rx="8" fill="#FFFBF0" stroke="#F0E3C7" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="6" fill="#E0A100"/>
      <text x="16" y="21.5" fill="#FFF" font-size="9" font-weight="700">2</text>
      <text x="30" y="21" text-anchor="start" fill="#C68E00" font-size="10.5" font-weight="700">Ouro Nórdico (10, 20 e 50 c)</text>
      <text x="12" y="38" text-anchor="start" fill="#3B372F" font-size="9">• Liga especial de cobre, alumínio e zinco</text>
      <text x="12" y="52" text-anchor="start" fill="#3B372F" font-size="9">• Bordos recortados e flor espanhola (20c)</text>
      <text x="12" y="66" text-anchor="start" fill="#665E55" font-size="8.5">• A de 10c é menor que a moeda de 5c</text>
    </g>

    <!-- Cartão 3: Moedas Bimetálicas (1 € e 2 €) -->
    <g transform="translate(536, 346)">
      <rect x="0" y="0" width="232" height="78" rx="8" fill="#F0F4F8" stroke="#D3E2EE" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="6" fill="#4F86B3"/>
      <text x="16" y="21.5" fill="#FFF" font-size="9" font-weight="700">3</text>
      <text x="30" y="21" text-anchor="start" fill="#2E5575" font-size="10.5" font-weight="700">Bimetálicas (1 € e 2 €)</text>
      <text x="12" y="38" text-anchor="start" fill="#3B372F" font-size="9">• Dois metais em anel e núcleo</text>
      <text x="12" y="52" text-anchor="start" fill="#3B372F" font-size="9">• 1 €: anel dourado + centro prateado</text>
      <text x="12" y="66" text-anchor="start" fill="#3E8F5C" font-size="8.5" font-weight="700">• 2 €: anel prateado + centro dourado (maior)</text>
    </g>
  </g>
</svg>